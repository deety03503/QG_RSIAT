<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1380" viewBox="0 0 1800 1380" role="img" aria-labelledby="title desc">
  <title id="title">QR-RSIAT method pipeline</title>
  <desc id="desc">Base-task quantum representation steering, incremental-task alignment and relational losses, class-statistic memory update, and inference path.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#718096"/>
    </marker>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      text { font-family: Inter, "Segoe UI", Arial, sans-serif; fill: #1d2a3a; }
      .title { font-size: 34px; font-weight: 750; letter-spacing: .2px; }
      .subtitle { font-size: 16px; fill: #617084; }
      .panel { fill: #ffffff; stroke: #d9e1eb; stroke-width: 2; }
      .panel-title { font-size: 23px; font-weight: 700; }
      .section-note { font-size: 14px; fill: #627186; }
      .box-title { font-size: 16px; font-weight: 700; }
      .body { font-size: 13.5px; fill: #536276; }
      .small { font-size: 12px; fill: #607086; }
      .formula { font-size: 15px; font-weight: 650; fill: #26364a; }
      .data { fill: #edf5ff; stroke: #6b9ed1; stroke-width: 2; }
      .train { fill: #fff4d9; stroke: #e5a52b; stroke-width: 2; }
      .frozen { fill: #edf1f6; stroke: #8493a7; stroke-width: 2; }
      .quantum { fill: #f1edff; stroke: #8972d6; stroke-width: 2; }
      .loss { fill: #eaf8f3; stroke: #39a486; stroke-width: 2; }
      .memory { fill: #eff7ec; stroke: #83aa69; stroke-width: 2; }
      .neutral { fill: #f8fafc; stroke: #c9d3df; stroke-width: 1.5; }
      .arrow { fill: none; stroke: #8492a5; stroke-width: 2.2; marker-end: url(#arrow); }
      .arrow-dark { fill: none; stroke: #526176; stroke-width: 2.4; marker-end: url(#arrow-dark); }
      .wire { fill: none; stroke: #9ba8b8; stroke-width: 1.8; }
      .dashed { stroke-dasharray: 7 6; }
      .tag { font-size: 11px; font-weight: 700; letter-spacing: .7px; }
    </style>
  </defs>

  <rect width="1800" height="1380" fill="#f4f7fb"/>
  <text class="title" x="42" y="55">QR-RSIAT Method Pipeline</text>
  <text class="subtitle" x="44" y="82">Full QR-RSIAT configuration · quantum options are opt-in and used only during training</text>

  <g transform="translate(1110 38)">
    <rect class="train" x="0" y="0" width="18" height="18" rx="5"/><text class="small" x="26" y="14">Trainable</text>
    <rect class="frozen" x="112" y="0" width="18" height="18" rx="5"/><text class="small" x="138" y="14">Frozen</text>
    <rect class="quantum" x="215" y="0" width="18" height="18" rx="5"/><text class="small" x="241" y="14">Quantum branch</text>
    <rect class="loss" x="370" y="0" width="18" height="18" rx="5"/><text class="small" x="396" y="14">Objective / update</text>
  </g>

  <!-- Base task -->
  <rect class="panel" x="40" y="110" width="540" height="840" rx="18"/>
  <text class="panel-title" x="66" y="151">1. Base task · t = 1</text>
  <text class="section-note" x="67" y="176">Learn new classes and shape their pairwise representation geometry.</text>

  <rect class="data" x="68" y="232" width="106" height="91" rx="12"/>
  <text class="tag" x="121" y="255" text-anchor="middle" fill="#4478ad">INPUT</text>
  <text class="box-title" x="121" y="279" text-anchor="middle">Labeled</text>
  <text class="box-title" x="121" y="299" text-anchor="middle">images D¹</text>

  <rect class="frozen" x="195" y="218" width="90" height="119" rx="12"/>
  <text class="box-title" x="240" y="269" text-anchor="middle">PTM</text>
  <text class="small" x="240" y="293" text-anchor="middle">frozen</text>
  <rect class="train" x="305" y="218" width="80" height="119" rx="12"/>
  <text class="box-title" x="345" y="266" text-anchor="middle">Adapter</text>
  <text class="body" x="345" y="290" text-anchor="middle">A¹</text>
  <text class="small" x="345" y="314" text-anchor="middle">trainable</text>

  <rect class="neutral" x="405" y="237" width="133" height="68" rx="12"/>
  <text class="box-title" x="471" y="264" text-anchor="middle">Feature f¹</text>
  <text class="small" x="471" y="286" text-anchor="middle">shared representation</text>
  <path class="arrow" d="M174 278 H195"/>
  <path class="arrow" d="M285 278 H305"/>
  <path class="arrow" d="M385 278 H405"/>

  <rect class="train" x="405" y="362" width="133" height="70" rx="12"/>
  <text class="box-title" x="471" y="390" text-anchor="middle">Classifier</text>
  <text class="body" x="471" y="412" text-anchor="middle">new-class logits</text>
  <path class="arrow" d="M471 305 V362"/>
  <rect class="loss" x="405" y="458" width="133" height="58" rx="11"/>
  <text class="box-title" x="471" y="483" text-anchor="middle">L_cls¹</text>
  <text class="small" x="471" y="502" text-anchor="middle">classification loss</text>
  <path class="arrow" d="M471 432 V458"/>

  <path class="wire dashed" d="M405 271 H386 V542 H135 V566"/>
  <rect class="quantum" x="68" y="566" width="135" height="105" rx="12"/>
  <text class="box-title" x="135" y="593" text-anchor="middle">Quantum</text>
  <text class="box-title" x="135" y="614" text-anchor="middle">feature map</text>
  <text class="small" x="135" y="640" text-anchor="middle">projection + RY/CNOT</text>
  <rect class="quantum" x="228" y="566" width="124" height="105" rx="12"/>
  <text class="box-title" x="290" y="594" text-anchor="middle">Real</text>
  <text class="box-title" x="290" y="615" text-anchor="middle">statevector</text>
  <text class="small" x="290" y="641" text-anchor="middle">ψ(f¹)</text>
  <rect class="quantum" x="377" y="566" width="161" height="105" rx="12"/>
  <text class="box-title" x="457" y="594" text-anchor="middle">Pairwise fidelity</text>
  <text class="formula" x="457" y="620" text-anchor="middle">Fᵢⱼ = |⟨ψᵢ|ψⱼ⟩|²</text>
  <text class="small" x="457" y="646" text-anchor="middle">same-class / different-class</text>
  <path class="arrow" d="M203 618 H228"/>
  <path class="arrow" d="M352 618 H377"/>

  <rect class="loss" x="178" y="719" width="273" height="88" rx="13"/>
  <text class="box-title" x="314" y="747" text-anchor="middle">QRS pair loss</text>
  <text class="body" x="314" y="770" text-anchor="middle">pull positive pairs · push negatives</text>
  <text class="small" x="314" y="790" text-anchor="middle">warm-up weight λ_QRS(e)</text>
  <path class="arrow" d="M457 671 V695 H314 V719"/>

  <rect class="loss" x="68" y="842" width="470" height="77" rx="13"/>
  <text class="tag" x="88" y="866" fill="#277e68">JOINT TRAINING OBJECTIVE</text>
  <text class="formula" x="303" y="897" text-anchor="middle">L¹ = L_cls¹ + λ_QRS(e) L_QRS</text>
  <path class="wire" d="M471 516 V826 H303 V842"/>
  <path class="wire" d="M314 807 V842"/>

  <!-- Incremental task -->
  <rect class="panel" x="605" y="110" width="1155" height="840" rx="18"/>
  <text class="panel-title" x="631" y="151">2. Incremental task · t &gt; 1</text>
  <text class="section-note" x="632" y="176">Student learns the new task while frozen teacher and class statistics provide retention signals.</text>

  <rect class="data" x="632" y="278" width="104" height="87" rx="12"/>
  <text class="tag" x="684" y="301" text-anchor="middle" fill="#4478ad">INPUT</text>
  <text class="box-title" x="684" y="326" text-anchor="middle">Images Dᵗ</text>
  <text class="small" x="684" y="347" text-anchor="middle">new classes</text>

  <rect class="frozen" x="781" y="207" width="83" height="102" rx="11"/>
  <text class="box-title" x="822" y="251" text-anchor="middle">PTM</text>
  <text class="small" x="822" y="273" text-anchor="middle">frozen</text>
  <rect class="train" x="879" y="207" width="76" height="102" rx="11"/>
  <text class="box-title" x="917" y="246" text-anchor="middle">Adapter</text>
  <text class="body" x="917" y="270" text-anchor="middle">Aᵗ</text>
  <text class="small" x="917" y="291" text-anchor="middle">trainable</text>
  <rect class="frozen" x="781" y="355" width="174" height="102" rx="12"/>
  <text class="tag" x="798" y="377" fill="#627286">FROZEN TEACHER</text>
  <text class="box-title" x="868" y="404" text-anchor="middle">Previous network</text>
  <text class="body" x="868" y="427" text-anchor="middle">θ<tspan baseline-shift="super" font-size="10">t−1</tspan> · inference mode</text>
  <text class="small" x="868" y="446" text-anchor="middle">fixed for task t</text>
  <path class="arrow" d="M736 321 H756 V258 H781"/>
  <path class="arrow" d="M756 321 V406 H781"/>

  <rect class="neutral" x="995" y="221" width="123" height="70" rx="11"/>
  <text class="box-title" x="1056" y="249" text-anchor="middle">Student fᵗ</text>
  <text class="small" x="1056" y="272" text-anchor="middle">current features</text>
  <rect class="neutral" x="995" y="371" width="123" height="70" rx="11"/>
  <text class="box-title" x="1056" y="399" text-anchor="middle">Teacher fᵗ⁻¹</text>
  <text class="small" x="1056" y="422" text-anchor="middle">reference features</text>
  <path class="arrow" d="M955 258 H995"/>
  <path class="arrow" d="M955 406 H995"/>

  <rect class="train" x="1150" y="207" width="142" height="102" rx="12"/>
  <text class="box-title" x="1221" y="241" text-anchor="middle">Classifier</text>
  <text class="body" x="1221" y="264" text-anchor="middle">old + new classes</text>
  <text class="small" x="1221" y="286" text-anchor="middle">updated head</text>
  <path class="arrow" d="M1118 256 H1150"/>
  <rect class="loss" x="1320" y="222" width="143" height="70" rx="11"/>
  <text class="box-title" x="1391" y="250" text-anchor="middle">L_clsᵗ</text>
  <text class="small" x="1391" y="273" text-anchor="middle">new-task labels</text>
  <path class="arrow" d="M1292 256 H1320"/>

  <!-- Feature-pair bus feeding the incremental objectives -->
  <path class="wire dashed" d="M1118 256 H1133 V481"/>
  <path class="wire dashed" d="M1118 406 H1143 V481"/>
  <path class="wire" d="M1133 481 H802 M1143 481 H1537"/>
  <path class="arrow" d="M802 481 V525"/>
  <path class="arrow" d="M1155 481 V525"/>
  <path class="arrow" d="M1537 481 V525"/>

  <rect class="panel" x="625" y="525" width="340" height="273" rx="14"/>
  <rect x="625" y="525" width="340" height="42" rx="14" fill="#f1edff"/>
  <text class="box-title" x="646" y="553">Quantum relational loss · qrel</text>
  <text class="small" x="646" y="589">Preserve pairwise geometry within the batch</text>
  <rect class="quantum" x="649" y="609" width="126" height="61" rx="10"/>
  <text class="box-title" x="712" y="635" text-anchor="middle">Student Kᵗ</text>
  <text class="small" x="712" y="655" text-anchor="middle">quantum kernel</text>
  <rect class="frozen" x="811" y="609" width="126" height="61" rx="10"/>
  <text class="box-title" x="874" y="635" text-anchor="middle">Target Kᵗ⁻¹</text>
  <text class="small" x="874" y="655" text-anchor="middle">frozen snapshot</text>
  <path class="arrow" d="M712 670 V698 H793 V711"/>
  <path class="arrow" d="M874 670 V698 H793 V711"/>
  <rect class="loss" x="681" y="711" width="224" height="58" rx="10"/>
  <text class="formula" x="793" y="735" text-anchor="middle">L_qrel = ||Kᵗ − sg(Kᵗ⁻¹)||²</text>
  <text class="small" x="793" y="756" text-anchor="middle">teacher kernel fixed during task</text>

  <rect class="panel" x="985" y="525" width="340" height="273" rx="14"/>
  <rect x="985" y="525" width="340" height="42" rx="14" fill="#fff4d9"/>
  <text class="box-title" x="1006" y="553">Residual quantum alignment</text>
  <text class="small" x="1007" y="589">Map the old feature into the current coordinates</text>
  <rect class="frozen" x="1007" y="610" width="104" height="57" rx="9"/>
  <text class="box-title" x="1059" y="634" text-anchor="middle">fᵗ⁻¹</text>
  <text class="small" x="1059" y="653" text-anchor="middle">teacher</text>
  <path class="arrow" d="M1111 638 H1131"/>
  <rect class="quantum" x="1131" y="603" width="171" height="75" rx="10"/>
  <text class="box-title" x="1216" y="626" text-anchor="middle">Pᵗ(·)</text>
  <text class="small" x="1216" y="647" text-anchor="middle">down-proj → RY/CNOT → X/Z</text>
  <text class="small" x="1216" y="665" text-anchor="middle">→ zero-init residual up-proj</text>
  <text class="small" x="1007" y="704">Pauli-X/Z readout returns 2q values; residual starts as identity.</text>
  <rect class="loss" x="1007" y="724" width="296" height="49" rx="9"/>
  <text class="formula" x="1155" y="746" text-anchor="middle">L_align = ||fᵗ − Pᵗ(fᵗ⁻¹)||²</text>
  <text class="small" x="1155" y="765" text-anchor="middle">feature matching</text>

  <rect class="panel" x="1345" y="525" width="395" height="273" rx="14"/>
  <rect x="1345" y="525" width="395" height="42" rx="14" fill="#f1edff"/>
  <text class="box-title" x="1366" y="553">Prototype orthogonality · qorth</text>
  <text class="small" x="1367" y="589">Suppress confusion with similar old classes</text>
  <rect class="memory" x="1368" y="608" width="347" height="47" rx="9"/>
  <text class="box-title" x="1541" y="628" text-anchor="middle">Old class prototypes μ_c</text>
  <text class="small" x="1541" y="646" text-anchor="middle">aligned by Pᵗ(·) · no old images stored</text>
  <path class="arrow" d="M1541 655 V672"/>
  <rect class="quantum" x="1368" y="672" width="347" height="43" rx="9"/>
  <text class="box-title" x="1541" y="699" text-anchor="middle">Fidelity Gᵢc between fᵗ and aligned μ_c</text>
  <path class="arrow" d="M1541 715 V730"/>
  <rect class="loss" x="1368" y="730" width="347" height="46" rx="9"/>
  <text class="formula" x="1541" y="750" text-anchor="middle">top-k → softmax weights → hinge</text>
  <text class="small" x="1541" y="769" text-anchor="middle">L_qorth</text>

  <rect class="loss" x="625" y="825" width="1115" height="96" rx="14"/>
  <text class="tag" x="648" y="851" fill="#277e68">JOINT INCREMENTAL OBJECTIVE · ENABLED BRANCHES TRAIN TOGETHER</text>
  <text class="formula" x="1182" y="883" text-anchor="middle">Lᵗ = L_clsᵗ + β(e)[L_alignᵗ + λ_qrel L_qrelᵗ] + γ(e)L_qorthᵗ</text>
  <text class="small" x="1182" y="906" text-anchor="middle">β and γ warm up; the previous-task network and qrel target remain frozen.</text>

  <!-- End-of-task state and inference -->
  <rect class="panel" x="40" y="980" width="1175" height="350" rx="18"/>
  <text class="panel-title" x="66" y="1020">3. End-of-task update · compact memory, no image replay</text>
  <text class="section-note" x="67" y="1046">After training, summarize the new classes and prepare the next incremental step.</text>

  <rect class="data" x="67" y="1080" width="164" height="101" rx="12"/>
  <text class="box-title" x="149" y="1111" text-anchor="middle">New-class</text>
  <text class="box-title" x="149" y="1132" text-anchor="middle">features</text>
  <text class="small" x="149" y="1158" text-anchor="middle">non-augmented pass</text>
  <path class="arrow" d="M231 1130 H258"/>
  <rect class="neutral" x="258" y="1080" width="184" height="101" rx="12"/>
  <text class="box-title" x="350" y="1111" text-anchor="middle">Float64 sufficient</text>
  <text class="box-title" x="350" y="1132" text-anchor="middle">statistics</text>
  <text class="small" x="350" y="1158" text-anchor="middle">globally merged sums/counts</text>
  <path class="arrow" d="M442 1130 H469"/>
  <rect class="memory" x="469" y="1080" width="188" height="101" rx="12"/>
  <text class="box-title" x="563" y="1111" text-anchor="middle">Class memory</text>
  <text class="formula" x="563" y="1137" text-anchor="middle">prototype μ_c</text>
  <text class="formula" x="563" y="1159" text-anchor="middle">covariance Σ_c</text>
  <path class="arrow" d="M657 1130 H684"/>
  <rect class="neutral" x="684" y="1080" width="190" height="101" rx="12"/>
  <text class="box-title" x="779" y="1111" text-anchor="middle">Classifier update</text>
  <text class="body" x="779" y="1135" text-anchor="middle">optional compensation</text>
  <text class="small" x="779" y="1158" text-anchor="middle">rank 0, then broadcast</text>
  <path class="arrow" d="M874 1130 H901"/>
  <rect class="frozen" x="901" y="1080" width="280" height="101" rx="12"/>
  <text class="box-title" x="1041" y="1111" text-anchor="middle">Atomic task checkpoint</text>
  <text class="body" x="1041" y="1135" text-anchor="middle">current model → frozen teacher for t+1</text>
  <text class="small" x="1041" y="1158" text-anchor="middle">retain newest two · resume validates metadata</text>

  <rect x="67" y="1210" width="1114" height="81" rx="12" fill="#f6f9fc" stroke="#d9e1eb" stroke-width="1.5"/>
  <text class="box-title" x="90" y="1241">Retained across tasks:</text>
  <text class="body" x="270" y="1241">per-class μ_c and Σ_c, classifier/model state, and task metadata.</text>
  <text class="small" x="90" y="1267">Raw images from old classes are not replayed; drift statistics can optionally adjust old class means.</text>

  <rect class="panel" x="1235" y="980" width="525" height="350" rx="18"/>
  <text class="panel-title" x="1261" y="1020">4. Inference</text>
  <text class="section-note" x="1262" y="1046">Prediction uses the standard RSIAT network path.</text>
  <rect class="data" x="1265" y="1090" width="105" height="81" rx="12"/>
  <text class="box-title" x="1317" y="1123" text-anchor="middle">Image x</text>
  <text class="small" x="1317" y="1147" text-anchor="middle">test sample</text>
  <path class="arrow-dark" d="M1370 1130 H1402"/>
  <rect class="neutral" x="1402" y="1080" width="174" height="101" rx="12"/>
  <text class="box-title" x="1489" y="1111" text-anchor="middle">Frozen PTM</text>
  <text class="body" x="1489" y="1135" text-anchor="middle">+ learned adapter</text>
  <text class="small" x="1489" y="1158" text-anchor="middle">feature f(x)</text>
  <path class="arrow-dark" d="M1576 1130 H1600"/>
  <rect class="neutral" x="1600" y="1090" width="129" height="81" rx="12"/>
  <text class="box-title" x="1664" y="1123" text-anchor="middle">Classifier</text>
  <text class="small" x="1664" y="1147" text-anchor="middle">prediction ŷ</text>
  <rect class="loss" x="1265" y="1210" width="464" height="81" rx="12"/>
  <text class="box-title" x="1497" y="1241" text-anchor="middle">Quantum branches are training-only</text>
  <text class="small" x="1497" y="1267" text-anchor="middle">No quantum circuit, fidelity kernel, or teacher at inference.</text>
</svg>
